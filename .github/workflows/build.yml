name: build
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        shell: pwsh
        run: g++ -O2 -std=c++17 -static -o thornsin_probe.exe thornsin_probe.cpp
      - uses: actions/upload-artifact@v4
        with:
          name: thornsin_probe
          path: thornsin_probe.exe
